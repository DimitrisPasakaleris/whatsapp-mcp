[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-mcp"
version = "0.3.0"
description = "WhatsApp integration for Claude via MCP — bridges WhatsApp Web to the Model Context Protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dimitris Pasakaleris" }]
keywords = ["whatsapp", "mcp", "model-context-protocol", "claude", "anthropic", "messaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.28.1",
  "mcp[cli]>=1.27.2",
  "requests>=2.34.2",
  "anyio<4.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.16",
  "mypy>=2.1.0",
]

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/DimitrisPasakaleris/whatsapp-mcp"
Repository = "https://github.com/DimitrisPasakaleris/whatsapp-mcp"
Issues = "https://github.com/DimitrisPasakaleris/whatsapp-mcp/issues"
Changelog = "https://github.com/DimitrisPasakaleris/whatsapp-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/whatsapp-bridge",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/manifest.json",
  "/server.json",
  "/launch.py",
  "/launch.bat",
  "/download_go.py",
]
exclude = [
  "whatsapp-bridge/store/**",
  "**/*.db",
  "**/*.db-*",
]

[tool.mcp]
name = "io.github.DimitrisPasakaleris/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["whatsapp-bridge", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
  "E501",   # line length handled by formatter
  "N818",   # exception names don't need Error suffix here (WhatsAppDBError does anyway)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/whatsapp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a running WhatsApp bridge and WHATSAPP_TEST_REAL=1",
]
addopts = "-ra --strict-markers"
